<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Primary brand radial gradient to match the soft blue glow -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%" fx="50%" fy="40%">
      <stop offset="0%" style="stop-color:#E8F4FB;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#F5F9FD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:1" />
    </radialGradient>
    
    <!-- Facet highlights for crystalline depth -->
    <linearGradient id="facetLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3A9DD6;stop-opacity:0.04" />
      <stop offset="100%" style="stop-color:#3A9DD6;stop-opacity:0.01" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGlow)"/>

  <!-- High-Density Crystalline Mesh -->
  <g stroke="#3A9DD6" stroke-width="0.5" stroke-opacity="0.12" fill="none">
    <!-- Center-focused dense facets -->
    <path d="M512 400 L620 320 L740 450 L512 550 L320 480 L380 340 Z" fill="#3a9dd605"/>
    
    <!-- Radiating crystalline structures -->
    <!-- Top -->
    <path d="M0 0 L400 120 L512 0 L700 150 L1024 0" />
    <path d="M400 120 L620 320 L512 400 L380 340 Z" fill="url(#facetLight)"/>
    
    <!-- Right -->
    <path d="M1024 0 L850 300 L1024 500 L800 700 L1024 1024" />
    <path d="M620 320 L850 300 L740 450 Z" fill="#3a9dd605"/>
    <path d="M740 450 L850 300 L1024 500 L800 700 L512 550 Z" fill="#3a9dd605"/>
    
    <!-- Bottom -->
    <path d="M1024 1024 L650 850 L512 1024 L300 900 L0 1024" />
    <path d="M512 550 L800 700 L650 850 L512 1024 L300 900 L320 480 Z" fill="url(#facetLight)"/>
    
    <!-- Left -->
    <path d="M0 1024 L150 700 L0 450 L250 250 L0 0" />
    <path d="M320 480 L300 900 L150 700 L0 450 Z" fill="#3a9dd605"/>
    <path d="M320 480 L0 450 L250 250 L380 340 Z" fill="#3a9dd605"/>

    <!-- Additional fine detail lines for complexity -->
    <line x1="512" y1="400" x2="512" y2="0" stroke-opacity="0.08"/>
    <line x1="740" y1="450" x2="1024" y2="500" stroke-opacity="0.08"/>
    <line x1="512" y1="550" x2="512" y2="1024" stroke-opacity="0.08"/>
    <line x1="320" y1="480" x2="0" y2="450" stroke-opacity="0.08"/>
    
    <!-- Connectors -->
    <path d="M620 320 L700 150 M380 340 L250 250 M300 900 L150 700 M650 850 L800 700" stroke-opacity="0.05"/>
  </g>

  <!-- Final soft wash for the "hues" -->
  <rect width="100%" height="100%" fill="url(#bgGlow)" style="mix-blend-mode: multiply; opacity: 0.15;"/>
</svg>